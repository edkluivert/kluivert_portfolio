name: Job tracker

on:
  schedule:
    - cron: "0 6 * * *"   # 07:00 Lagos
    - cron: "0 14 * * *"  # 15:00 Lagos
  workflow_dispatch:
    inputs:
      command:
        description: What
        type: choice
        default: scan
        options: [scan, digest]
      dry_run:
        description: Skip sending any email
        type: boolean
        default: false
  repository_dispatch:
    types: [send_application, set_status, rescan]

permissions:
  contents: write

concurrency:
  group: job-tracker
  cancel-in-progress: fal

jobs:
  tracker:
    runs-on: ubuntu-lates
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tracker/requirements.txt

      - run: pip install -r tracker/requirements.txt

      - name: Run tracker
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSW_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVENT: ${{ gith
          ACTION: ${{ github.event.action }}
          INPUT_COMMAND:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          JOB_ID: ${{ gitd }}
          JOB_TO: ${{ github.event.client_payload.to }}
          JOB_NOTE: ${{ g.note }}
          JOB_STATUS: ${{ github.event.client_payload.status }}
        run: |
          set -euo pipefail
          DRY=""
          [ "${INPUT_DRY_RUN:-false}" = "true" ] && DRY="--dry-run"
          case "$EVENT:$A
            repository_dispatch:send_application)
              args=(send
              [ -n "${JOB_TO:-}" ] && args+=(--to "$JOB_TO")
              [ -n "${JOBte "$JOB_NOTE")
              python tracker/tracker.py "${args[@]}"
              ;;
            repository_dispatch:set_status)
              args=(statu"$JOB_STATUS")
              [ -n "${JOB_NOTE:-}" ] && args+=(--note "$JOB_NOTE")
              python trac"
              ;;
            repository_di
              python tracker/tracker.py scan --no-digest
              ;;
            workflow_dispatch:*)
              python tracUT_COMMAND:-scan}"
              ;;
            *)
              python tracker/tracker.py scan
              ;;
          esac

      - name: Commit tracker state
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ git
        run: |
          set -euo pipefa
          git config user.name "job-tracker[bot]"
          git config user"41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "CTION:-} $(date -u+%Y-%m-%dT%H:%MZ)"
          git pull --reba
          git push origin HEAD:main
