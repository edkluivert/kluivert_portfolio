name: Job tracker

on:
  schedule:
    - cron: "0 6 * * *"   # 07:00 Lagos
    - cron: "0 14 * * *"  # 15:00 Lagos
  workflow_dispatch:
    inputs:
      command:
        description: What to run
        type: choice
        default: scan
        options: [scan, digest]
      dry_run:
        description: Skip sending any email
        type: boolean
        default: false
  repository_dispatch:
    types: [send_application, set_status, rescan]

permissions:
  contents: write

# Runs that touch tracker/data/jobs.json must not overlap.
concurrency:
  group: job-tracker
  cancel-in-progress: false

jobs:
  tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tracker/requirements.txt

      - run: pip install -r tracker/requirements.txt

      - name: Run tracker
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          INPUT_COMMAND: ${{ inputs.command }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          # Dashboard payload values are passed through env, never templated into the script.
          JOB_ID: ${{ github.event.client_payload.id }}
          JOB_TO: ${{ github.event.client_payload.to }}
          JOB_NOTE: ${{ github.event.client_payload.note }}
          JOB_STATUS: ${{ github.event.client_payload.status }}
        run: |
          set -euo pipefail
          DRY=""
          [ "${INPUT_DRY_RUN:-false}" = "true" ] && DRY="--dry-run"
          case "$EVENT:$ACTION" in
            repository_dispatch:send_application)
              args=(send --id "$JOB_ID")
              [ -n "${JOB_TO:-}" ] && args+=(--to "$JOB_TO")
              [ -n "${JOB_NOTE:-}" ] && args+=(--note "$JOB_NOTE")
              python tracker/tracker.py "${args[@]}"
              ;;
            repository_dispatch:set_status)
              args=(status --id "$JOB_ID" --status "$JOB_STATUS")
              [ -n "${JOB_NOTE:-}" ] && args+=(--note "$JOB_NOTE")
              python tracker/tracker.py "${args[@]}"
              ;;
            repository_dispatch:rescan)
              python tracker/tracker.py scan --no-digest
              ;;
            workflow_dispatch:*)
              python tracker/tracker.py $DRY "${INPUT_COMMAND:-scan}"
              ;;
            *)
              python tracker/tracker.py scan
              ;;
          esac

      - name: Commit tracker state
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          git config user.name "job-tracker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker/data/jobs.json
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "tracker: ${EVENT:-run} ${ACTION:-} $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main
