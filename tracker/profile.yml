# Job tracker profile. Edit freely; the scanner reads this on every run.
# Scores are 0-100. A job becomes a "match" at min_score and goes in the digest.

me:
  name: Kluivert Edegware
  headline: Senior Mobile Engineer (Flutter, Android/Kotlin)
  email: edkluivert@gmail.com
  portfolio: https://edkluivert.github.io/kluivert_portfolio/
  linkedin: https://www.linkedin.com/in/kluivert-edegware-913882172/
  resume: assets/Kluivert-Edegware-Resume.pdf
  # Used by the digest and by the LLM rerank to judge fit. Keep it honest and specific.
  summary: >
    Mobile engineer with 6+ years shipping production Flutter and native Android apps.
    Ten apps live on Google Play and the App Store, including fintech and EV-charging products
    with wallets, payments, passkeys, runtime app protection and behavioural biometrics.
    Clean architecture, Bloc, dependency injection, CI/CD, App Store and Play Console releases.
    Based in Nigeria (UTC+1), works remotely with teams in Europe, Africa and the Americas.

matching:
  min_score: 55          # digest + dashboard "match" threshold
  llm_from_score: 40     # jobs at or above this get the optional Claude rerank
  llm_max_per_run: 25    # cap on Claude calls per scan (cost control)
  max_age_days: 21       # ignore postings older than this
  keep_unmatched_days: 30  # prune unmatched jobs from the tracker after this

  # Words in the TITLE. Weight is added once per keyword found.
  title:
    flutter: 45
    dart: 35
    mobile: 30
    android: 30
    ios: 22
    kotlin: 20
    swift: 5
    engineer: 5
    developer: 5
    senior: 5
    lead: 5
    staff: 3

  # Words in the DESCRIPTION. Weight added once per keyword found.
  body:
    flutter: 15
    dart: 8
    bloc: 5
    kotlin: 5
    "jetpack compose": 4
    swift: 3
    firebase: 4
    "clean architecture": 4
    fintech: 4
    payments: 4
    wallet: 3
    "app store": 3
    "google play": 3
    "play store": 3
    "fully remote": 2

  # Any of these in the title kills the job (score 0).
  title_exclude:
    - intern
    - internship
    - unpaid
    - wordpress
    - salesforce
    - ".net"
    - recruiter
    - sales
    - marketing
    - "account executive"
    - "customer success"
    - "data entry"
    - game
    - "product manager"
    - designer

  # Hard location gate: a job scores 0 unless it is fully remote AND open to someone in Nigeria.
  location:
    country: Nigeria
    # If the job's location names any place, one of these must appear in it.
    # A bare "Remote" with no place named passes, and the phrases below are checked instead.
    allow: [nigeria, africa, emea, worldwide, anywhere, global, "utc+1", "gmt+1"]
    # In the title or location field, any of these means it isn't fully remote.
    not_remote: [hybrid, on-site, onsite, in-office, "in office"]
    # Anywhere in the posting. Ignored when an allowed place follows within ~80 characters
    # (so "must be based in Africa or Europe" passes, "must be based in the US" doesn't).
    restricted_phrases:
      - us only
      - usa only
      - u.s. only
      - eu only
      - uk only
      - canada only
      - must be located in
      - must reside in
      - must be based in
      - must live in
      - must be a resident of
      - authorized to work in
      - authorised to work in
      - right to work in
      - eligible to work in
      - work authorization
      - visa sponsorship is not available
      - us-based
      - uk-based
      - eu-based
      - based in the us
      - based in the uk
      - within the us
      - within the united states
      - security clearance
      - office-based
      - hybrid role
      - hybrid position
      - hybrid work
      - hybrid model
      - hybrid schedule
      - on-site role
      - onsite role
      - work on-site
      - work onsite
      - days in the office
      - days a week in the office
      - days per week in the office

  # Roles on another cross-platform stack. Applied only when the posting never mentions Flutter,
  # so "Flutter or React Native" still scores normally. First hit wins (title checked before body).
  other_stacks_title:
    "react native": -60
    expo: -50
    ionic: -60
    xamarin: -60
    maui: -60
    cordova: -60
    capacitor: -50
    swiftui: -40
    swift: -35
  other_stacks_body:
    "react native": -30
    expo: -20
    ionic: -30
    xamarin: -30
    maui: -30

  # Penalties (negative numbers) for words anywhere.
  penalties:
    "junior": -15
    "entry level": -15
    "entry-level": -15
    "security clearance": -30
    "c++": -5
    "unity": -10

  # Bonuses for location text that suits you.
  location_bonus:
    "anywhere in the world": 15
    "worldwide": 15
    "global": 10
    "africa": 15
    "nigeria": 20
    "emea": 8
    "europe": 5
    "utc": 5

sources:
  remotive:
    enabled: true
    searches: [flutter, "mobile developer", android]
  remoteok:
    enabled: true
    tags: [flutter, mobile, android, ios]
  himalayas:
    enabled: true
    searches: [flutter, "mobile engineer", android]
  jobicy:
    enabled: true
    tags: [flutter, mobile, android]
  arbeitnow:
    enabled: true
    searches: [flutter, "mobile developer"]
    remote_only: true
  weworkremotely:
    enabled: true
    feeds:
      - https://weworkremotely.com/categories/remote-programming-jobs.rss
      - https://weworkremotely.com/categories/remote-full-stack-programming-jobs.rss
  # Company career pages with public APIs. Add board slugs as you find them
  # (the slug is the last path segment of boards.greenhouse.io/<slug> or jobs.lever.co/<slug>).
  greenhouse:
    enabled: true
    boards: []
  lever:
    enabled: true
    companies: []

email:
  # Who receives the digest. Falls back to me.email.
  digest_to: edkluivert@gmail.com
  digest_subject: "Job tracker: {count} new match(es)"
  application_subject: "Application for {title} - {name}"
  # Fully automatic sending per source (only where the posting lists an application email).
  auto_send:
    remotive: true
    remoteok: true
    himalayas: true
    jobicy: true
    arbeitnow: true
    weworkremotely: true
    greenhouse: true
    lever: true
  # Hard cap on automatic sends per run, even where auto_send is on.
  auto_send_max_per_run: 3
